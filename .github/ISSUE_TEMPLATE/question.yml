name: Question
description: Ask how something works.
title: "[Question] "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: "Thanks for the report. **Composer: Report a Problem** in VS Code (or asking Claude to report it) fills in the environment for you."
  - type: textarea
    id: description
    attributes:
      label: Your question
      description: What would you like to know?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Versions, OS and Doctor results (filled in by Composer).
      render: text
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Recent Composer and helper log lines (filled in by Composer; paths are shortened).
      render: text
